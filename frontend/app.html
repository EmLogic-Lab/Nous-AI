<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=overlays-content"
    >

    <title>Nous</title>

    <link rel="stylesheet" href="app.css">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar" id="sidebar">

        <!-- SIDEBAR HEADER -->

        <div class="sidebar-header">

            <!-- OPEN STATE -->

            <div class="nous-brand">
                Nous
            </div>


            <!-- COLLAPSED STATE -->

            <button
                class="collapsed-brand"
                id="collapsedBrand"
                aria-label="Open sidebar"
                title="Open sidebar"
            >
                <img src="assets/favicon.svg" alt="Nous">

                <span class="collapsed-open-icon">

                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 6l6 6-6 6"></path>
                    </svg>

                </span>

            </button>


            <div class="sidebar-header-spacer"></div>


            <div class="sidebar-header-actions">

                <!-- SEARCH -->

                <button
                    class="sidebar-icon-btn"
                    id="searchBtn"
                    aria-label="Search"
                    title="Search"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="6.5"></circle>
                        <path d="M16 16l5 5"></path>
                    </svg>
                </button>


                <!-- CLOSE -->

                <button
                    class="sidebar-icon-btn"
                    id="collapseBtn"
                    aria-label="Close sidebar"
                    title="Close sidebar"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15 6l-6 6 6 6"></path>
                    </svg>
                </button>

            </div>

        </div>


        <!-- ================= NAVIGATION ================= -->

        <nav class="main-nav">

            <!-- NEW CHAT -->

            <button
                class="nav-item new-chat-btn"
                id="newChatBtn"
            >

                <span class="nav-icon">

                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 5v14"></path>
                        <path d="M5 12h14"></path>
                    </svg>

                </span>

                <span class="nav-label">
                    New Chat
                </span>

            </button>


            <!-- EXTENSIONS -->

            <button class="nav-item">

                <span class="nav-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="
                            M17 22H5
                            A3 3 0 0 1 2 19
                            V9
                            A3 3 0 0 1 5 6
                            H6
                            A4 4 0 0 1 13.3 3.82
                            A3.86 3.86 0 0 1 14 6
                            H17

                            V10
                            A4 4 0 0 1 20.18 17.3
                            A3.86 3.86 0 0 1 18 18
                            V21
                            A1 1 0 0 1 17 22Z
                        "></path>
                    </svg>

                </span>

                <span class="nav-label">
                    Extensions
                </span>

            </button>


            <!-- PROJECTS -->

            <button class="nav-item">

                <span class="nav-icon">

                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 7h6l2 2h10v10H3z"></path>
                        <path d="M3 7V5h7l2 2"></path>
                    </svg>

                </span>

                <span class="nav-label">
                    Projects
                </span>

            </button>


            <!-- RECENT -->

            <button
                class="nav-item recent-nav-btn"
                id="openRecentFromSidebar"
            >

                <span class="nav-icon recent-icon">

                    <svg viewBox="0 0 20 20" aria-hidden="true">

                        <path d="
                            M4.5 4.5h11
                            A2.5 2.5 0 0 1 18 7
                            v5.5
                            a2.5 2.5 0 0 1-2.5 2.5
                            H9
                            l-4.5 3
                            v-3.2
                            A2.5 2.5 0 0 1 2 12.3
                            V7
                            A2.5 2.5 0 0 1 4.5 4.5Z
                        "></path>

                    </svg>

                </span>

                <span class="nav-label">
                    Recent
                </span>

            </button>

        </nav>


        <!-- ================= RECENT CONTENT ================= -->

        <section class="recent-section">

            <div class="history-list">

                <button class="history-item">
                    Design layout iterations
                </button>

                <button class="history-item">
                    Fixing flexbox overflow bug
                </button>

                <button class="history-item">
                    Building Nous AI
                </button>

            </div>

        </section>

                </span>

                <span class="nav-label">
                    Settings
                </span>

            </button>

        </div>

    </aside>


    <!-- ================= RECENT OVERLAY ================= -->

    <div
        class="recent-popup"
        id="recentPopup"
        aria-hidden="true"
    >

        <div class="recent-popup-header">

            <span>
                Recent
            </span>

            <button
                class="recent-popup-close"
                id="recentPopupClose"
                aria-label="Close recent"
                title="Close"
            >

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18"></path>
                </svg>

            </button>

        </div>


        <div class="recent-popup-list">

            <button>
                Design layout iterations
            </button>

            <button>
                Fixing flexbox overflow bug
            </button>

            <button>
                Building Nous AI
            </button>

        </div>

    </div>


    <!-- ================= MAIN ================= -->

    <main class="main-container">

        <!-- MOBILE HEADER -->

        <header class="mobile-header">

            <button
                class="mobile-circle-btn"
                id="mobileMenuBtn"
                aria-label="Open menu"
            >

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 7h16M4 12h16M4 17h16"></path>
                </svg>

            </button>


            <div class="mobile-header-spacer"></div>

        </header>


        <!-- CHAT AREA -->

        <section
            class="chat-area"
            id="chatArea"
        >

            <div
                class="welcome-section"
                id="welcomeSection"
            >

                <h1 class="welcome-title">
                    How can I help you today?
                </h1>

            </div>

        </section>


        <!-- ================= TASKBAR ================= -->

        <div
            class="chat-bottom"
            id="chatBottom"
        >

            <div class="input-wrapper">

                <textarea
                    class="chat-textarea"
                    id="chatInput"
                    rows="1"
                    placeholder="Ask anything..."
                    aria-label="Message Nous"
                ></textarea>


                <div class="input-actions">

                    <!-- ADD -->

                    <div class="toolbar-buttons">

                        <button
                            class="action-btn mobile-action-circle"
                            id="uploadBtn"
                            title="Add"
                            aria-label="Add"
                        >

                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"></path>
                            </svg>

                        </button>

                    </div>


                    <div class="right-buttons">

                        <!-- MICROPHONE -->

                        <button
                            class="action-btn mic-btn"
                            id="micBtn"
                            title="Voice"
                            aria-label="Voice"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <rect
                                    x="9"
                                    y="2"
                                    width="6"
                                    height="12"
                                    rx="3"
                                ></rect>

                                <path d="M5 10a7 7 0 0 0 14 0"></path>

                                <line
                                    x1="12"
                                    y1="17"
                                    x2="12"
                                    y2="22"
                                ></line>

                                <line
                                    x1="8"
                                    y1="22"
                                    x2="16"
                                    y2="22"
                                ></line>

                            </svg>

                        </button>


                        <!-- SEND -->

                        <button
                            class="send-btn"
                            id="sendBtn"
                            title="Send"
                            aria-label="Send"
                        >

                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 19V5"></path>
                                <path d="M5 12l7-7 7 7"></path>
                            </svg>

                        </button>

                    </div>

                </div>

            </div>


            <p class="disclaimer">
                Nous can make mistakes. Verify important information.
            </p>

        </div>

    </main>


    <!-- ================= MOBILE OVERLAY ================= -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <script src="app.js"></script>

</body>
</html>
